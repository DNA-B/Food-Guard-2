services:
  db:
    image: postgres:latest
    env_file: .env # 환경변수
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  redis:
    image: redis:alpine
    container_name: fooo-redis
    ports:
      - "6379:6379"
