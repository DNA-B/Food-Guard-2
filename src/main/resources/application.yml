spring:
  application:
    name: fooo-guard
  config:
    import: optional:file:.env[.properties]

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
  output:
    ansi:
      enabled: always

  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  secret: ${JWT_SECRET}
  expiration-time: ${JWT_EXPIRATION_TIME} # 1시간 (밀리초 단위)

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
